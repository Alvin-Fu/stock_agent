[mypy]
python_version = 3.11
ignore_missing_imports = true
strict_optional = true
disallow_untyped_defs = false
disallow_any_unimported = false
warn_return_any = false
warn_unused_ignores = true

# 核心流水线文件逐步启用严格检查
[mypy-tools.support_resistance]
disallow_untyped_defs = true

[mypy-tools.trade_plan]
disallow_untyped_defs = true

[mypy-tools.forecast]
disallow_untyped_defs = true

[mypy-agents.responder.responder_agent]
disallow_untyped_defs = true

[mypy-tools.report_formatter]
disallow_untyped_defs = true

[mypy-storage.sqlite.stock_storage]
disallow_untyped_defs = true
