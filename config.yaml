# =====================================================================
# 配置模板：真实密钥请复制本文件为 local.yaml 再填写（local.yaml 不入库，优先加载）
# =====================================================================

# 全局模型配置
models:
  # DeepSeek（LLMFactory 主用）：models.deepseek.api_key / url
  deepseek:
    api_key: ""                          # 必填：DeepSeek API key
    url: "https://api.deepseek.com/v1"
  # 本地/远程 Ollama：models.ollama.url
  ollama:
    api_key: ""
    url: "http://127.0.0.1:11434"
  brain_model: "deepseek-reasoner"       # get_ds 使用
  llm_model: "qwen3.5:9b"                # get_llm（Ollama）使用
  device: "cpu"

# 嵌入模型（远程 Ollama）：embedding.model / url
embedding:
  model: "bge-m3:latest"
  url: "http://127.0.0.1:11434"

# 远程 Docker Chroma 服务
chroma_server:
  host: "127.0.0.1"
  port: 8000
  ssl: false

# 检索配置
retriever:
  top_k: 3
  use_reranker: false                    # 开启前先配置真实的 CrossEncoder 模型
  reranker_model: "BAAI/bge-reranker-base"  # 注意：必须是 CrossEncoder 模型，不能填 Ollama LLM 名

# 多知识库配置（新增知识库只需在这里加配置）
knowledge_bases:
  kb_stock:
    name: "股票知识库"
    data_path: "./data/kb_stock"
    collection_name: "collection_stock"
    chunk_size: 500
    chunk_overlap: 50
  kb_product:
    name: "产品文档知识库"
    data_path: "./data/kb_product"
    collection_name: "collection_product"
    chunk_size: 500
    chunk_overlap: 50
  kb_technical:
    name: "技术文档知识库"
    data_path: "./data/kb_technical"
    collection_name: "collection_technical"
    chunk_size: 600
    chunk_overlap: 60

# =====================================================================
# 多Agent模型配置（真实生效）：
# - defaults：所有 agent 的默认 LLM 参数
# - 按 agent 名单独覆盖（不写的项回落 defaults）：
#   router（大脑路由）/ analyst（财务）/ researcher（联网研究）/
#   technical（技术面）/ responder（报告生成）/ compliance（合规）/ retriever（检索改写）
# - 可覆盖项：provider（deepseek/ollama）、model、temperature、max_tokens
# =====================================================================
agents:
  defaults:
    provider: "deepseek"
    model: "deepseek-v4-flash"
    temperature: 0.1
  # 示例：让报告生成表达更自然、路由换更便宜的模型（按需取消注释）
  # responder:
  #   temperature: 0.3
  # router:
  #   model: "deepseek-v4-flash"
  # technical:
  #   model: "deepseek-reasoner"
  # monitor:                       # 监控类短任务（新闻评估/快照抽取/触发核对），全天高频跑，
  #   model: "deepseek-v4-flash"   # 适合配便宜快的模型


# 工具配置（tushare token 读的是 tools.stock.tushare_token）
tools:
  stock:
    tushare_token: ""                    # 去 tushare.pro 官网申请

database:
  sqlite_path: "./data/sqlite/stock.db"

# 联网搜索（填了 tavily_api_key 用 Tavily，否则用 DuckDuckGo；
# 结构化信源——东财新闻/巨潮公告/财联社快讯——走 akshare 免 key，自动启用）
search:
  tavily_api_key: ""

# 飞书机器人（python feishu_bot.py 启动；长连接模式，无需公网地址）
feishu:
  app_id: ""          # 开放平台自建应用 App ID（cli_ 开头）
  app_secret: ""      # 应用 Secret
  push_open_id: ""    # 监控主动推送给谁：你的 open_id（可先留空，给机器人发条消息，日志里会打印）
  webhook_url: ""     # 群自定义机器人 webhook（可选：不建应用时的纯推送兜底）

# 监控配置（watchlist 通过飞书发「监控 比亚迪」管理）
monitor:
  enabled: true
  signal_scan_time: "15:10"      # 盘后信号扫描时间（交易日）
  news_interval_minutes: 30      # 新闻/政策扫描间隔（分钟，仅 8:00-22:00 执行）
  price_change_threshold: 5.0    # 涨跌幅提醒阈值（%）
  daily_push_limit: 20           # 每日推送上限（防轰炸）
  news_importance_min: "中"      # 新闻重要性达到该级别才推送（高/中/低）
  review_after_days: 5           # 个股分析满 N 个自然日后自动复盘
  industry_review_after_days: 10 # 产业链分析满 N 个自然日后自动复盘（产业逻辑兑现较慢）
  review_time: "15:40"           # 自动复盘时间（交易日盘后）
